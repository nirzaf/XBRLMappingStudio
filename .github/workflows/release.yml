name: Release

# Build, test, and package distributable artifacts, then publish a GitHub
# Release. Triggered by version tags (vX.Y.Z) or a manual dispatch.
#
# Scope note (architecture guide): signed Windows installers (UI07) and
# locked/signed release bundles (OPS06/OPS07) are OWNER-GATED. This pipeline
# therefore produces *unsigned, portable* artifacts only and does not claim
# code-signing or installer packaging.

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 1.2.0). Defaults to 0.0.0-dev when unset.'
        required: false
        default: ''

permissions:
  contents: write   # create the GitHub Release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: XBRLMappingStudio.slnx

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Compute version from tag / input
        id: v
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${{ github.event_name }}" == "push" && "$REF" == v* ]]; then
            VERSION="${REF#v}"; TAG="$REF"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-0.0.0-dev}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

  verify:
    name: Build & test (gate)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore ${{ env.SOLUTION }}
      - run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore
      - run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

  publish-cli:
    name: CLI ${{ matrix.rid }}
    needs: [ meta, verify ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os_ext: zip
          - rid: linux-x64
            os_ext: tar.gz
          - rid: osx-x64
            os_ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Publish self-contained CLI
        run: >
          dotnet publish src/XBRLMappingStudio.CLI -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=false
          -p:Version=${{ needs.meta.outputs.version }}
          -o out/${{ matrix.rid }}
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd out/${{ matrix.rid }}
          if [ "${{ matrix.os_ext }}" = "zip" ]; then
            zip -qr "../../xbrl-studio-${{ needs.meta.outputs.version }}-${{ matrix.rid }}.zip" .
          else
            tar czf "../../xbrl-studio-${{ needs.meta.outputs.version }}-${{ matrix.rid }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: 'xbrl-studio-*-${{ matrix.rid }}.*'

  publish-desktop:
    name: Desktop ${{ matrix.rid }}
    needs: [ meta, verify ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, linux-x64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Publish self-contained Desktop (unsigned portable build)
        run: >
          dotnet publish src/XBRLMappingStudio.Desktop -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=false
          -p:Version=${{ needs.meta.outputs.version }}
          -o out/desktop-${{ matrix.rid }}
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd out
          tar czf "../../desktop-${{ needs.meta.outputs.version }}-${{ matrix.rid }}.tar.gz" desktop-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: 'desktop-*-${{ matrix.rid }}.tar.gz'

  github-release:
    name: Publish GitHub Release
    needs: [ meta, publish-cli, publish-desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: XBRL Mapping Studio ${{ needs.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## XBRL Mapping Studio ${{ needs.meta.outputs.tag }}

            Automated build. Artifacts are **unsigned portable** packages.

            > Signed Windows installers and locked/signed release bundles are
            > owner-gated (guide IDs UI07, OPS06/OPS07) and are **not** produced here.

            ### CLI (`xbrl-studio`)
            - `xbrl-studio-<version>-win-x64.zip`
            - `xbrl-studio-<version>-linux-x64.tar.gz`
            - `xbrl-studio-<version>-osx-x64.tar.gz`

            ### Desktop (portable, unsigned)
            - `desktop-<version>-win-x64.tar.gz`
            - `desktop-<version>-linux-x64.tar.gz`
            - `desktop-<version>-osx-x64.tar.gz`
