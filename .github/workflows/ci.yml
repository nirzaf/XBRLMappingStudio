name: CI

# Continuous integration: build the full solution and run the whole test
# suite on every pull request and on pushes to the default branch.
# Mirrors the guide's verification gate: clean Release build + all tests green.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: XBRLMappingStudio.slnx

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu 24.04 to keep the authoritative Linux gate stable across
        # GitHub's ubuntu-latest image migration; Windows exercises the product target.
        os: [ ubuntu-24.04, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python for worker process tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} --locked-mode -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Report vulnerable NuGet packages (direct and transitive)
        shell: bash
        run: |
          set -euo pipefail
          dotnet list "$SOLUTION" package --vulnerable --include-transitive --format json --no-restore \
            | tee "nuget-vulnerability-report-${{ matrix.os }}.json"

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Self-test synthetic taxonomy benchmark
        run: dotnet tools/performance/taxonomy-benchmark/bin/Release/net10.0/XBRLMappingStudio.TaxonomyBenchmark.dll --self-test

      - name: Test (Release)
        # Subprocess-supervision tests launch nested workers; avoid host-load timeouts across projects.
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build -m:1 --filter "Category!=ProcessMemory" --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"

      - name: Qualify streaming and snapshot memory separately
        shell: bash
        run: |
          set -euo pipefail
          # Heap measurements are process-global. Each 100k-row workload needs
          # a fresh host, without a prior test's in-memory equivalence oracle.
          # These are excluded above but remain mandatory on both platforms.
          for workload in CsvHundredThousandRows_StreamsExactOutputAndKeepsBatchWorkingSetBounded HundredThousandRows_StreamsExactOutputAndKeepsBatchWorkingSetBounded GroupHundredThousandRows_PartitionsWithBoundedMemoryAndExactTotals JoinHundredThousandRows_PartitionsWithBoundedMemoryAndExactTotals TableSnapshotHundredThousandRows_CopiesWithBoundedMemoryAndExactRows; do
            dotnet test tests/XBRLMappingStudio.Integration.Tests/XBRLMappingStudio.Integration.Tests.csproj \
              -c Release --no-build \
              --filter "FullyQualifiedName=XBRLMappingStudio.Integration.Tests.LargeRunExecutionTests.$workload" \
              --logger "trx;LogFileName=memory-$workload.trx"
            # VSTest can return success for a filter matching zero tests.
            python -c "import sys, xml.etree.ElementTree as E; c = E.parse(sys.argv[1]).find('.//{*}Counters'); assert c is not None and c.get('total') == c.get('executed') == c.get('passed') == '1', 'Expected exactly one passing memory qualification'" \
              "tests/XBRLMappingStudio.Integration.Tests/TestResults/memory-$workload.trx"
          done

      - name: Repeat Windows worker cancellation regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Existence of worker.pid does not guarantee its writer has released it
          # on Windows. Keep the readiness/cancellation fix under repeated load.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            dotnet test tests/XBRLMappingStudio.Integration.Tests/XBRLMappingStudio.Integration.Tests.csproj `
              -c Release --no-build `
              --filter FullyQualifiedName~CancellingArelleRequestKillsTheWorkerProcess `
              --logger "trx;LogFileName=worker-cancellation-$attempt.trx"
            if ($LASTEXITCODE -ne 0) { throw "Worker cancellation regression failed on attempt $attempt." }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-dependency-reports-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            nuget-vulnerability-report-${{ matrix.os }}.json
          if-no-files-found: ignore

  arelle-worker:
    name: Arelle worker integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned worker runtime
        run: python -m pip install --require-hashes -r tools/worker/requirements.lock

      - name: Test protocol, offline taxonomy and validation
        run: python -m unittest discover -s tools/worker/tests -v

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Execute Excel-to-XBRL mapping through Arelle
        env:
          XMS_ARELLE_E2E: '1'
          XMS_ARELLE_PYTHON: python
        run: dotnet test tests/XBRLMappingStudio.Integration.Tests/XBRLMappingStudio.Integration.Tests.csproj -c Release --filter FullyQualifiedName~ArelleExecutionTests

      - name: Test locked dependency inventory generator
        run: python -m unittest discover -s tools/tests -v

      - name: Restore locked release dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/XBRLMappingStudio.CLI/XBRLMappingStudio.CLI.csproj --locked-mode -p:Configuration=Release
          dotnet restore src/XBRLMappingStudio.Desktop/XBRLMappingStudio.Desktop.csproj --locked-mode -p:Configuration=Release

      - name: Generate SPDX release dependency inventory
        run: python tools/dependency_inventory.py --output artifacts/dependencies.spdx.json

      - name: Upload SPDX release dependency inventory
        uses: actions/upload-artifact@v6
        with:
          name: dependency-sbom
          path: artifacts/dependencies.spdx.json
          if-no-files-found: error

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject committed build output (bin/ obj/)
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(bin|obj)/' ; then
            echo "::error::bin/ or obj/ artifacts are tracked in git. Untrack them."
            exit 1
          fi
          echo "OK: no tracked build output."

      - name: Reject edits to the architecture guide
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          GUIDE="XBRL_Mapping_Studio.md"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -F "$GUIDE"; then
            echo "::error::$GUIDE is authoritative and read-only; revert changes to it."
            exit 1
          fi
          echo "OK: architecture guide untouched."
